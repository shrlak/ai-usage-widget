# package.json 의 version 을 올려서 main 에 푸시하면 Mac(.dmg) · Windows(.exe) 설치 파일을 만들어
# GitHub Releases 의 v<version> 에 올림 (Release 와 태그는 electron-builder 가 만듦)
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check macOS signature
        if: runner.os == 'macOS'
        run: for app in dist/mac*/*.app; do codesign -dv "$app"; done
